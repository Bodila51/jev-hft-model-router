name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/generate_demo_registry.py
      - run: pytest
      - run: JEV_HFT_BACKEND=heuristic jev-hft evaluate
      - run: JEV_HFT_BACKEND=heuristic jev-hft validate-registry
